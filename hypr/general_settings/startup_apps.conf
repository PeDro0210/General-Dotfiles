
$wallDIR=$HOME/Pictures/wallpapers

# For wallpaper
exec-once = swww-daemon --format xrgb

# For clipboard
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

# For th one and only Miku cursor
exec-once = hyprctl setcursor ffxi-chocobo-cursor 24


# BUG: for some reason hyprctl returns unknown values on the version -j

# Pyprland
exec-once = pypr &
# Quickshell
exec-once = quickshell &

# home-assistant
exec-once = bash -c ~/Documents/Shell-Scripts/home-assistant/startup_strip.sh

# Workspaces with shorcuts
exec-once = [workspace special:spotify silent] wezterm start ncspot # at the end is using spotify
exec-once = [workspace special:sessions silent] firefox --start-fullscreen --new-window -new-tab -url https://x.com/home
exec-once = [workspace special:pavucontrol silent] wezterm start wiremix
exec-once = [workspace special:btop silent] wezterm start btop
exec-once = [workspace special:openrgb silent] openrgb


