$wallDIR=$HOME/Pictures/wallpapers

# For wallpaper
exec-once = swww-daemon --format xrgb

# For clipboard
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

# FOR THE ONE AND ONLY MIKU CURSOR
#
exec-once = hyprctl setcursor miku-cursor-linux 24

# For notifications
#exec-once = dunst

#The waybar
exec-once = waybar &

# Pyprland
exec-once = pypr &


# Workspaces with shorcuts
exec-once = [workspace special:spotify silent] spotify
exec-once = [workspace special:sessions silent] firefox --start-fullscreen --new-window
exec-once = [workspace special:pavucontrol silent] wezterm start wiremix
exec-once = [workspace special:btop silent] wezterm start btop
exec-once = [workspace special:openrgb silent] openrgb


