format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
${custom.jj}\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "A33638"

[character]
success_symbol = "[❯](A33638)"
error_symbol = "[❯](542738)"
vimcmd_symbol = "[❮](A33638)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "bright-black"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "A33638"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"

[custom.jj]
command = "prompt"
format = "$output"
ignore_timeout = true
shell = ["starship-jj", "--ignore-working-copy", "starship"]
use_stdin = false
when = true
